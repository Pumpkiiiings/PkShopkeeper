settings:
  # Silenciar por completo a las entidades de las tiendas
  silence-shop-entities: true
  
  # Si el nombre de la tienda siempre es visible a través de las paredes
  always-show-nameplates: false
  
  # Si las entidades no se ven afectadas por la gravedad (flotan)
  disable-gravity: false
  
  # Lista de entidades permitidas para las tiendas
  enabled-living-shops:
    - VILLAGER
    - ZOMBIE
    - SKELETON
    - WITCH
    - PIGLIN
    - COW
    - SHEEP
    - PIG
    - CREEPER
    - IRON_GOLEM
    - SNOW_GOLEM
    - SLIME
    - MAGMA_CUBE
