# GUI menu configuration
# You can use & for legacy colors or MiniMessage tags like <red>.

main-menu:
  title: "&8Shop Control Panel - %id%"
  btn-edit-trades: "&e&lEdit Trades"
  btn-edit-trades-lore:
    - "&7Opens the menu to add"
    - "&7or remove items and prices."
  btn-change-name: "&a&lChange Name"
  btn-change-name-lore:
    - "&7Rename to &f%name%"
    - "&7(Supports MiniMessage)"
  btn-change-type: "&b&lChange Entity"
  btn-change-type-lore:
    - "&7Current: &a%type%"
    - "&7Baby: &a%baby%"
    - ""
    - "&eClick to change."
  btn-villager-type: "&d&lChange Biome"
  btn-villager-type-lore:
    - "&7Current: &a%type%"
    - ""
    - "&eClick to change."
  btn-villager-level: "&a&lChange Level"
  btn-villager-level-lore:
    - "&7Badge level: &a%level%"
    - ""
    - "&eClick to change."
  btn-delete-shop: "&c&lDelete Shop"
  btn-delete-shop-lore:
    - "&7Permanently deletes the shop."
    - "&c(Irreversible)"
  btn-close: "&7&lClose"
  btn-close-lore:
    - "&7Close this menu."

editor:
  title: "&8PkShop Editor"
  btn-save: "&a&lSave"
  btn-save-lore:
    - "&7Save the current trades."
  btn-prev-page: "&e&lPrevious Page"
  btn-prev-page-lore:
    - "&7Go to the previous page."
  btn-next-page: "&e&lNext Page"
  btn-next-page-lore:
    - "&7Go to the next page."
