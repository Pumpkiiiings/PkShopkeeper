  btn-back: "&cBack"
  btn-back-lore:
    - "&7Return to the main menu."
  btn-prev-page: "&ePrevious Page"
  btn-prev-page-lore:
    - "&7Go to the previous page."
  btn-next-page: "&eNext Page"
  btn-next-page-lore:
    - "&7Go to the next page."

profession-selector:
