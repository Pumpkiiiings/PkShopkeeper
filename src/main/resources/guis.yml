main-menu:
  title: "<black>      <underlined>Shop - %id%</underlined>"
  btn-edit-trades: "<dark_gray>(<color:#4AFF56>✪</color><dark_gray>) <white>Menu <dark_gray>► <color:#4AFF56>Edit Trades</color>"
  btn-edit-trades-lore:
    - "<dark_gray>⌜ Shop Control Panel ⌟"
    - ""
    - "<color:#4AFF56> ⓘ Information:"
    - "<white> Add or remove items"
    - "<white> and prices from this shop."
    - ""
    - "<color:#FAE033> ♫ Click to open!"
  btn-change-name: "<dark_gray>(<color:#FFB266>✪</color><dark_gray>) <white>Menu <dark_gray>► <color:#FFB266>Change Name</color>"
  btn-change-name-lore:
    - "<dark_gray>⌜ Shop Control Panel ⌟"
    - ""
    - "<color:#4AFF56> ⓘ Information:"
    - "<white> Current: <color:#FFB266>%name%"
    - "<white> (Supports MiniMessage)"
    - ""
    - "<color:#FAE033> ♫ Click to rename!"
  btn-change-type: "<dark_gray>(<color:#25D2FF>✪</color><dark_gray>) <white>Menu <dark_gray>► <color:#25D2FF>Change Entity</color>"
  btn-change-type-lore:
    - "<dark_gray>⌜ Shop Control Panel ⌟"
    - ""
    - "<color:#4AFF56> ⓘ Information:"
    - "<white> Current: <color:#25D2FF>%type%"
    - "<white> Baby: <color:#25D2FF>%baby%"
    - ""
    - "<color:#FAE033> ♫ Click to change!"
  btn-villager-type: "<dark_gray>(<color:#B266FF>✪</color><dark_gray>) <white>Menu <dark_gray>► <color:#B266FF>Change Biome</color>"
  btn-villager-type-lore:
    - "<dark_gray>⌜ Shop Control Panel ⌟"
    - ""
    - "<color:#4AFF56> ⓘ Information:"
    - "<white> Current: <color:#B266FF>%type%"
    - ""
    - "<color:#FAE033> ♫ Click to change!"
  btn-villager-level: "<dark_gray>(<color:#4AFF56>✪</color><dark_gray>) <white>Menu <dark_gray>► <color:#4AFF56>Change Level</color>"
  btn-villager-level-lore:
    - "<dark_gray>⌜ Shop Control Panel ⌟"
    - ""
    - "<color:#4AFF56> ⓘ Information:"
    - "<white> Badge level: <color:#4AFF56>%level%"
    - ""
    - "<color:#FAE033> ♫ Click to change!"
  btn-delete-shop: "<dark_gray>(<color:#BA0F0F>✪</color><dark_gray>) <white>Menu <dark_gray>► <color:#BA0F0F>Delete Shop</color>"
  btn-delete-shop-lore:
    - "<dark_gray>⌜ Shop Control Panel ⌟"
    - ""
    - "<color:#4AFF56> ⓘ Information:"
    - "<white> Permanently deletes this shop."
    - "<color:#FF5555> Cannot be undone!"
    - ""
    - "<color:#FAE033> ♫ Click to delete!"
  btn-close: ' <color:#FF4848>(✖) Close </color>'
  btn-close-lore: []

editor:
  title: "<black>      <underlined>Trade Editor</underlined>"
  btn-save: "<dark_gray>(<color:#4AFF56>✪</color><dark_gray>) <white>Menu <dark_gray>► <color:#4AFF56>Save</color>"
  btn-save-lore:
    - "<dark_gray>⌜ Trade Editor ⌟"
    - ""
    - "<color:#4AFF56> ⓘ Information:"
    - "<white> Save the current trade layout."
    - ""
    - "<color:#FAE033> ♫ Click to save!"
  btn-prev-page: ' <color:#FF4848>(←) Previous </color>'
  btn-prev-page-lore: []
  btn-next-page: ' <color:#4AFF56>(→) Next </color>'
  btn-next-page-lore: []
  trade-slot-label: "<dark_gray>[Trade #%trade%]"

entity-selector:
  title: "<black>      <underlined>Select Entity</underlined>"
  btn-baby-toggle: "<dark_gray>(<color:#FAE033>✪</color><dark_gray>) <white>Menu <dark_gray>► <color:#FAE033>Toggle Baby</color>"
  btn-baby-toggle-lore:
    - "<dark_gray>⌜ Entity Selector ⌟"
    - ""
    - "<color:#4AFF56> ⓘ Information:"
    - "<white> Toggle baby mode on or off."
    - "<white> Current: <color:#FAE033>%baby%"
    - ""
    - "<color:#FAE033> ♫ Click to toggle!"
  btn-change-prof: "<dark_gray>(<color:#3399FF>✪</color><dark_gray>) <white>Menu <dark_gray>► <color:#3399FF>Change Profession</color>"
  btn-change-prof-lore:
    - "<dark_gray>⌜ Entity Selector ⌟"
    - ""
    - "<color:#4AFF56> ⓘ Information:"
    - "<white> Current: <color:#3399FF>%profession%"
    - ""
    - "<color:#FAE033> ♫ Click to change!"
  btn-back: ' <color:#FF4848>(←) Back </color>'
  btn-back-lore: []
  btn-prev-page: ' <color:#FF4848>(←) Previous </color>'
  btn-prev-page-lore: []
  btn-next-page: ' <color:#4AFF56>(→) Next </color>'
  btn-next-page-lore: []

profession-selector:
  title: "<black>      <underlined>Select Profession</underlined>"
  btn-back: ' <color:#FF4848>(←) Back </color>'
  btn-back-lore: []

